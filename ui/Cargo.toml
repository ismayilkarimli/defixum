[package]
name = "defixum-ui"
version = "0.1.0"
edition = "2021"
description = "Defixum's windows: the settings window, the pause and bedtime screens, and the ⌘Tab toast, in Rust compiled to WebAssembly."

[dependencies]
forest = { path = "../forest" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "AnimationEvent", "CanvasRenderingContext2d", "console", "ClipboardEvent", "CssStyleDeclaration", "DataTransfer",
  "Document", "DomRect", "DomStringMap", "DomTokenList", "Element", "Event", "EventTarget",
  "HtmlButtonElement", "HtmlCanvasElement", "HtmlCollection", "HtmlElement", "HtmlHeadElement",
  "HtmlInputElement", "HtmlStyleElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent",
  "Location", "MediaQueryList", "MouseEvent", "Node", "NodeList", "Performance", "Storage",
  "SvgElement", "UrlSearchParams", "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
